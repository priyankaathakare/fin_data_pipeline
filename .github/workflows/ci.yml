name: Enterprise CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff and run linter
        run: |
          pip install ruff
          ruff check .

  test:
    name: Django Checks & Migrations (PostgreSQL + Redis)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fin_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-insecure-test-key
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: fin_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fin_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DB_NAME: fin_test_db
      DB_USER: postgres
      DB_PASSWORD: fin_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Validate OpenAPI 3.0 schema
        run: python manage.py spectacular --file schema.yml --validate

      - name: Run Django test suite
        run: python manage.py test

  docker-build:
    name: Docker Image Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fin_data_pipeline:ci .