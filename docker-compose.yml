services:
  db:
    image: postgres:15-alpine
    container_name: fin_postgres
    environment:
      POSTGRES_DB: fin_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fin_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: fin_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=fin_pipeline
      - DB_USER=postgres
      - DB_PASSWORD=adminpassword
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: fin_celery
    command: celery -A core worker -l info
    volumes:
      - .:/app
    environment:
      - DB_NAME=fin_pipeline
      - DB_USER=postgres
      - DB_PASSWORD=adminpassword
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: fin_celery_beat
    command: celery -A core beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:


